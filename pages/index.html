<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sashiko</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root {
      --bg: #f5f5f5;
      --border: #ccc;
      --text: #24292f;
      --text-muted: #666;
      --link: #007bff;
      --card-bg: #fff;
      --card-hover: #e0e0e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --border: #30363d;
        --text: #c9d1d9;
        --text-muted: #8b949e;
        --link: #58a6ff;
        --card-bg: #161b22;
        --card-hover: #21262d;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      color-scheme: light dark;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .hero {
      text-align: center;
      margin-bottom: 3rem;
    }
    .hero img {
      height: 72px;
      margin-bottom: 1rem;
    }
    .hero h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 420px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      max-width: 760px;
      width: 100%;
      margin-bottom: 3rem;
    }
    .card {
      display: block;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s;
    }
    .card:hover {
      background: var(--card-hover);
    }
    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: var(--link);
    }
    .card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .card.disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    .card.disabled h2 {
      color: var(--text-muted);
    }
    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      width: 100%;
      max-width: 760px;
    }
    footer a {
      color: var(--link);
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="hero">
    <img src="logo.png" alt="sashiko logo">
    <h1>sashiko</h1>
    <p>agentic code review system for Linux kernel</p>
  </div>

  <div class="cards">
    <a class="card" href="rustdoc/sashiko/index.html">
      <h2>api docs</h2>
      <p>Rustdoc for all public and private items</p>
    </a>
    <a class="card" href="https://sashiko.dev">
      <h2>sashiko.dev</h2>
      <p>Production review dashboard</p>
    </a>
    <a class="card disabled" href="#">
      <h2>openapi sandbox</h2>
      <p>Coming soon</p>
    </a>
  </div>

  <footer>
    <a href="https://github.com/sashiko-dev/sashiko">github.com/sashiko-dev/sashiko</a>
  </footer>
</body>
</html>
